<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meu Mercado</title>
  <meta name="description" content="Meu Mercado - Sua Lista de Compras Inteligente">
  <meta name="theme-color" content="#188A55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meu Mercado">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F5735;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #app-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #mercado-frame {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
      display: block;
      background-color: #FFFFFF;
    }

    /* Tela de Carregamento Elegante */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #188A55 0%, #10633C 50%, #0B4228 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      z-index: 9999;
      color: #FFFFFF;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash-screen.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      border: 3px solid #F8D117;
      margin-bottom: 20px;
      animation: pulse 1.8s infinite ease-in-out;
    }

    .splash-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .splash-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .splash-spinner {
      margin-top: 28px;
      width: 32px;
      height: 32px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #F8D117;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Tela de Abertura -->
    <div id="splash-screen">
      <div class="splash-logo">🛒</div>
      <div class="splash-title">Meu Mercado</div>
      <div class="splash-sub">Conectando à sua lista de compras...</div>
      <div class="splash-spinner"></div>
    </div>

    <!-- Frame Seguro do Meu Mercado -->
    <iframe
      id="mercado-frame"
      src="https://script.google.com/macros/s/AKfycbyVzn-uiAsqoXOxDGDqeVTTr3pFWPEc6SfqmiTH8j3YTAnr4MPrKRAXtQjbPI7VHp3x9w/exec"
      title="Meu Mercado"
      allow="geolocation; camera; microphone"
    ></iframe>
  </div>

  <script>
    const frame = document.getElementById('mercado-frame');
    const splash = document.getElementById('splash-screen');

    // Ocultar a tela de splash assim que a WebApp carregar
    frame.addEventListener('load', () => {
      setTimeout(() => {
        splash.classList.add('oculto');
      }, 500);
    });

    // Fallback de segurança se o evento de load demorar
    setTimeout(() => {
      splash.classList.add('oculto');
    }, 4000);
  </script>
</body>
</html>
